 operating system.", "Adding new features to software.", "Fixing security vulnerabilities in software and hardware.", "Speeding up application performance."], "a": 2}, {"t": "mcq", "q": "What are the botnets used in DDoS attacks?", "o": ["Advanced artificial intelligence programs.", "A network of compromised devices that are remotely controlled.", "Superfast computers.", "A group of secure servers."], "a": 1}, {"t": "tf", "q": "Ransomware permanently damages your device.", "a": false}, {"t": "tf", "q": "Distributed denial of service (DDoS) attacks target only one device.", "a": false}, {"t": "tf", "q": "Social engineering relies on exploiting vulnerabilities in technical systems.", "a": false}, {"t": "tf", "q": "Sharing your personal information with anyone you trust online is always safe.", "a": false}, {"t": "fill", "q": "A _____ program helps detect and remove malware from your device.", "a": ["antivirus", "anti-virus", "anti virus"]}, {"t": "fill", "q": "Attempts to steal your personal information via fake emails are called _____.", "a": ["phishing"]}, {"t": "fill", "q": "A _____ program encrypts your files and demands a ransom to recover them.", "a": ["ransomware", "ransom ware"]}, {"t": "fill", "q": "A _____ attack aims to disable a website or online service by sending massive amounts of requests.", "a": ["ddos", "distributed denial of service", "denial of service"]}, {"t": "fill", "q": "The art of tricking people into giving up confidential information is called _____.", "a": ["social engineering"]}, {"t": "fill", "q": "In DDoS attacks, a network of compromised devices is called _____.", "a": ["botnet", "botnets"]}, {"t": "fill", "q": "A targeted _____ is an advanced type of phishing that targets specific individuals.", "a": ["spear phishing", "spear-phishing"]}], "ti": ["Cyber Security Guardian", "🛡️"]}, {"n": "Big Data", "e": "📊", "vid": "https://www.youtube.com/results?search_query=what+is+big+data+5Vs+explained", "cards": [{"i": "📊", "t": "The Concept of Big Data", "h": "<p>Large, complex data that <b>cannot be processed efficiently</b> with traditional tools such as Excel. Analyzing it helps people make better and faster decisions.</p>"}, {"i": "📡", "t": "Sources of Big Data", "h": "<div class=\"chips\"><span>⌚ IoT devices</span><span>💬 Social media</span><span>💳 Financial data</span><span>📱 Smart devices</span><span>🎬 Digital content</span><span>🏛️ Government data</span><span>🛰️ Geographic data</span></div>"}, {"i": "✋", "t": "The 5Vs of Big Data", "h": "<div class=\"steps\"><div><i>1</i><b>Volume:</b> the massive amount of data</div><div><i>2</i><b>Velocity:</b> the speed of generating and processing</div><div><i>3</i><b>Variety:</b> structured and unstructured types</div><div><i>4</i><b>Veracity:</b> reliability and quality</div><div><i>5</i><b>Value:</b> usefulness we can get from it</div></div>"}, {"i": "🗂️", "t": "Types of Big Data", "h": "<div class=\"sc\"><table><tr><th>Type</th><th>Meaning</th><th>Example</th></tr><tr><td>Structured</td><td>Tables with rows &amp; columns</td><td>Customer data</td></tr><tr><td>Unstructured</td><td>No fixed form</td><td>Text, images, videos</td></tr><tr><td>Semi-structured</td><td>A hybrid of both</td><td>Emails</td></tr></table></div>"}, {"i": "📝", "t": "Dear Student", "h": "<p>Always record data accurately and cite your sources. It makes information more reliable and easier to verify.</p>"}], "q": [{"t": "tf", "q": "Big data can be easily processed using Excel.", "a": false}, {"t": "tf", "q": "Big data analysis allows analysts, researchers, and entrepreneurs to make better and faster decisions.", "a": true}, {"t": "tf", "q": "Internet-connected devices are a source of big data.", "a": true}, {"t": "tf", "q": "All data collected through social media is documented.", "a": false}, {"t": "tf", "q": "Financial data is not considered big data.", "a": false}, {"t": "tf", "q": "When you make an online purchase using a credit card, data about the amount, the store, and the geographic location is recorded.", "a": true}, {"t": "tf", "q": "Smartphones do not generate big data.", "a": false}, {"t": "tf", "q": "Your mobile phone constantly tracks your geographic location and collects data about the places you visit and the apps you use.", "a": true}, {"t": "tf", "q": "Digital content such as videos generates big data.", "a": true}, {"t": "tf", "q": "Videos, images, and audio content uploaded or viewed online do not generate big data.", "a": false}, {"t": "tf", "q": "Governments generate data through population registers, statistics, tax data, and censuses.", "a": true}, {"t": "tf", "q": "Satellites and GPS devices collect data about geographic locations, roads, and the environment.", "a": true}, {"t": "tf", "q": "The characteristics of big data include \"volume\" and \"value.\"", "a": true}, {"t": "tf", "q": "The speed of data generation is not a characteristic of big data.", "a": false}, {"t": "tf", "q": "The variety of data types includes structured data (such as databases) and unstructured data (such as text, images, and videos).", "a": true}, {"t": "tf", "q": "Veracity refers to the reliability and quality of data.", "a": true}, {"t": "tf", "q": "Structured data is data that comes in an unstructured form, such as customer data and financial data.", "a": false}, {"t": "tf", "q": "Unstructured data is data that does not come in a structured form, such as tables or databases.", "a": true}, {"t": "tf", "q": "Semi-structured data is a hybrid of structured and unstructured data.", "a": true}, {"t": "tf", "q": "Emails are a good example of structured data.", "a": false}], "ti": ["Deputy Cyber Security Commander", "⚔️"]}, {"n": "Big Data and Its Relationship to Artificial Intelligence", "e": "🧠", "vid": "https://www.youtube.com/results?search_query=big+data+and+artificial+intelligence+relationship+explained", "cards": [{"i": "⚙️", "t": "Stages of Big Data Processing", "h": "<div class=\"steps\"><div><i>1</i><b>Collection:</b> gather data from sources</div><div><i>2</i><b>Storage:</b> servers or cloud databases</div><div><i>3</i><b>Cleaning:</b> remove errors &amp; duplicates</div><div><i>4</i><b>Analysis:</b> using AI and machine learning</div><div><i>5</i><b>Information extraction:</b> useful insights for decisions</div></div>"}, {"i": "🧰", "t": "Uses of Big Data", "h": "<div class=\"chips\"><span>🤖 Artificial Intelligence</span><span>📈 Machine &amp; Deep Learning</span><span>🔐 Network monitoring &amp; cybersecurity</span><span>🛒 E-commerce</span></div><p>The more quality, volume and variety of data, the better models learn and predict.</p>"}, {"i": "🚀", "t": "Role of Big Data in AI", "h": "<div class=\"chips\"><span>🎯 Better accuracy</span><span>💬 NLP (language models)</span><span>👁️ Computer vision</span><span>🔮 Predictive analytics</span><span>🔍 Hidden insights</span><span>🔄 Continuous learning</span><span>⚡ Task automation</span></div>"}, {"i": "⛽", "t": "Big Data Feeds AI", "h": "<p>Big data is the <b>raw material</b> that feeds AI. Without it, AI would be only theoretical algorithms. AI turns this raw data into strategic information.</p>"}], "q": [{"t": "tf", "q": "Big data has no role in the development and effectiveness of artificial intelligence.", "a": false}, {"t": "tf", "q": "AI technologies help in processing and analyzing big data.", "a": true}, {"t": "tf", "q": "One of the stages of big data processing is data cleaning.", "a": true}, {"t": "tf", "q": "The data collection stage is the process of collecting large amounts of data from various sources.", "a": true}, {"t": "tf", "q": "The process of processing big data does not require storing that data.", "a": false}, {"t": "tf", "q": "Data cleaning means dealing with errors, duplication, or incorrect data.", "a": true}, {"t": "tf", "q": "Data analysis using advanced tools and techniques such as artificial intelligence.", "a": true}, {"t": "tf", "q": "Information extraction takes place before data analysis.", "a": false}, {"t": "tf", "q": "Machine learning and deep learning do not require big data.", "a": false}, {"t": "tf", "q": "Big data is used to monitor networks and cybersecurity.", "a": true}, {"t": "tf", "q": "E-commerce platforms rely on big data to understand customer behavior.", "a": true}, {"t": "tf", "q": "Big data does not allow models to be trained on a wide range of scenarios and conditions.", "a": false}, {"t": "tf", "q": "Computer vision applications, such as face recognition and object detection, do not require massive datasets of images and videos to train their models.", "a": false}, {"t": "tf", "q": "The role of big data in AI is to improve accuracy and performance and enable AI applications.", "a": true}, {"t": "tf", "q": "Advanced AI applications include predictive analytics and computer vision.", "a": true}, {"t": "tf", "q": "AI does not use big data to understand customer interactions with products and services.", "a": false}, {"t": "tf", "q": "Big data helps machine learning algorithms recognize patterns and make decisions without human interference.", "a": true}, {"t": "tf", "q": "Big data improves task automation in areas such as customer service, logistics, and finance.", "a": true}, {"t": "tf", "q": "Big data is not the raw material that feeds artificial intelligence.", "a": false}, {"t": "tf", "q": "AI is just a set of theoretical algorithms that are incapable of learning or delivering real value without big data.", "a": true}], "ti": ["Cyber Security Commander", "👑"]}];

function question(){

 else a=`<input type="text" id="fi" placeholder="Type your answer..." onkeydown="if(event.key=='Enter')ans()"><br><button onclick="ans()">Check ✔</button>`;
 const k={mcq:"Choose the correct answer",tf:"True or False",fill:"Fill in the gap"}[q.t];
 R(`<div class="card"><div class="sub">Level ${S.lv+1} Quiz · Question ${S.qi+1} / ${tot} · ${k}</div><div class="bar"><i style="width:${S.qi/tot*100}%"></i></div><div class="q">${esc(q.q)}</div><div id="ops">${a}</div><div class="fb" id="fb"></div><div id="nx"></div><button class="alt sm" onclick="rq()">🔊 Read question</button></div>`);if(S.snd)rq()}
let lock=false;

 const q=D[S.lv].q[S.qi];let ok;
 if(q.t=="fill"){const x=document.getElementById("fi").value.trim().toLowerCase().replace(/\s+/g," ");if(!x)return;ok=q.a.includes(x)}
 else ok=v===q.a;
 const fb=document.getElementById("fb");
 if(ok){S.c++;S.pts+=PTS;fb.style.color="var(--ok)";fb.textContent=`✅ Correct! +${PTS} points`}
 else{fb.style.color="var(--bd)";fb.textContent="❌ Not correct. "+(q.t=="mcq"?"Answer: "+q.o[q.a]:q.t=="tf"?"Answer: "+(q.a?"True":"False"):"Answer: "+q.a[0])}
 document.querySelectorAll("#ops .op").forEach((b,i)=>{b.disabled=true;if(q.t=="mcq"){if(i==q.a)b.classList.add("ok");else if(i===v)b.classList.add("no")}else if(q.t=="tf"){if((i==0)===q.a)b.classList.add("ok");else if((i==0)===v)b.classList.add("no")}});
 tone(ok?"ok":"no");if(S.snd)setTimeout(()=>say(ok?"Correct!":"Not correct. The correct answer is "+an),ok?500:600);

function tdash(msg){
 const m=Object.values(tget()).sort((a,b)=>a.n.localeCompare(b.n)),N=m.length,all=m.filter(o=>o.r.every(r=>r[0]!=null)).length,avg=N?Math.round(m.reduce((a,o)=>a+o.p,0)/N):0;
 const cell=r=>r[0]!=null?r[0]+"% "+emo(r[0]):r[1]?"❌ "+r[1]+" tries":"–";
 R(`<div class="card"><h2>👩‍🏫 Class Dashboard</h2><div class="g"><div><b>${N}</b>Students</div><div><b>${all}</b>Finished all 4</div><div><b>${avg}</b>Avg. points</div>${D.map((l,i)=>`<div><b>${m.filter(o=>o.r[i][0]!=null).length}</b>Passed L${i+1}</div>`).join("")}</div>
 <p class="sub">Students tap “Send report to teacher” in their dashboard. Paste the messages or codes here:</p><textarea id="pa" placeholder="ICT1...."></textarea><div class="msg" id="mg" style="color:var(--ok)">${msg||""}</div><button onclick="tadd()">➕ Add to table</button><button class="alt" onclick="tcsv()">⬇ Export CSV</button><button class="alt" onclick="tclear()">🗑 Clear</button>

let AC;function tone(k){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime,C={ok:[[660,0],[880,.13],[1100,.26]],no:[[220,0],[160,.2]],win:[[523,0],[659,.16],[784,.32],[1047,.48],[1319,.7]],lose:[[392,0],[330,.25],[262,.5],[196,.75]]}[k],ty={ok:"sine",no:"sawtooth",win:"triangle",lose:"square"}[k],ln=(k=="win"||k=="lose")?.28:(k=="ok"?.14:.3);C.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.001,t0+d);g.gain.exponentialRampToValueAtTime(.22,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+ln);o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+ln+.05)})}catch(e){}}

const plain=h=>h.replace(/<[^>]+>/g," ").replace(/&amp;/g,"and").replace(/&[a-z]+;/g," ").replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F\u200D➜]/gu,"").replace(/\s+/g," ").trim();
function stopS(){tk++;if(syn)syn.cancel()}
function say(t,done){if(!syn)return;stopS();const my=tk,ps=(t.match(/[^.!?\n]+[.!?]?/g)||[t]).filter(x=>x.trim());let i=0,on=false;const vs=syn.getVoices(),vo=vs.find(x=>/^en[-_]US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));const n=()=>{if(my!==tk)return;if(i>=ps.length){done&&done();return}const u=new SpeechSynthesisUtterance(ps[i++].trim());u.lang="en-US";if(vo)u.voice=vo;u.rate=.95;u.onstart=()=>{on=true};u.onend=n;u.onerror=n;syn.speak(u)};setTimeout(()=>{if(my===tk)n()},200);setTimeout(()=>{if(!on&&my===tk&&!window._nw){window._nw=1;msg("🔇 No sound? Raise the media volume and make sure Google Text-to-Speech has an English voice installed.")}},3000)}

function home(){go("home")}function cover(){go("title")}
const lp=id=>id.length==2&&id[0]=="L";
function prev(){const p=S.pg;if(lp(p)&&S.ci>0){stopS();S.story=false;S.ci--;render();return}const i=PG.indexOf(p);if(i>0){const q=PG[i-1];go(q,lp(q)?D[+q[1]].cards.length:0)}}
function next(){const p=S.pg;if(p=="title"){startName();return}if(Z.active&&(p=="pre"||p=="fin"||p[0]=="Q")){if(!lockA){msg("Please answer the question first.");return}if(Z.i==Z.qs.length-1)zEnd();else{Z.i++;zq()}return}if(lp(p)&&S.ci<D[+p[1]].cards.length){stopS();S.story=false;S.ci++;render();return}const i=PG.indexOf(p);if(i>=0&&i<PG.length-1)go(PG[i+1])}
function topbar(){return S.name?`<div class="top"><span>👤 <b>${esc(S.name)}</b> · ⭐ <b>${S.pts}</b></span><span><button class="alt sm" id="sb" onclick="tsnd()">${S.snd?"🔊":"🔇"}</button><button class="alt sm" onclick="go('map')">☰</button><button class="alt sm" onclick="go('dash')">📊</button></span></div>`:""}
function R(h){const none=S.pg=="title"||S.pg=="home";$.innerHTML=topbar()+'<div id="toast" class="toast"></div>'+h+(none?"":`<div class="nav2"><button class="alt" onclick="prev()">⬅ Previous</button><button onclick="go('home')">🏠 Home</button>${S.pg=="cert"?`<button class="alt" onclick="exitApp()">🚪 Exit</button>`:`<button class="alt" onclick="next()">Next ➡</button>`}</div>`);window.scrollTo(0,0)}
function render(){const p=S.pg,f={title:pTitle,credits:pCred,about:pAbout,unit:pUnit,home:pHome,map:pMap,cert:pCert,dash:dash}[p];if(f)f();else if(p=="pre"||p=="fin")intro(p);else if(lp(p))lessonP();else intro("q",+p[1])}
function startName(){const v=document.getElementById("nm").value.trim();if(!v){msg("Please enter your name first.");return}if(S.name&&v!==S.name)Object.assign(S,{res:[],att:[0,0,0,0],pre:null,fin:null,fa:0,pts:0,seen:[]});S.name=v;save();go("home")}
function pTitle(){R(`<div class="card c"><div class="big">🛡️💻</div><h1>Information &amp; Communication Technology (ICT)</h1><h2>Second Year Preparatory – First Term</h2><p class="sub">Unit 1: Artificial Intelligence and Protecting Our Digital Data</p><p>Enter your full name, then tap <b>Continue</b>:</p><input type="text" id="nm" maxlength="40" placeholder="Your name..." value="${esc(S.name)}" onkeydown="if(event.key=='Enter')startName()"><br><button onclick="startName()">Continue ➜</button><p><a href="#" onclick="tgate();return false" class="sub">👩‍🏫 Teacher area</a></p></div>`)}
function pCred(){R(`<div class="card c"><div class="big">🎓</div><div class="ar"><div><b>إعداد:</b> بسمله وليد علي ابراهيم</div><div><b>المستوى الثالث</b></div><div>كلية التربية النوعية – قسم تكنولوجيا التعليم – جامعة عين شمس</div><div><b>البرنامج الدراسي:</b> اعداد اخصائي تكنولوجيا التعليم</div><div><b>تحت اشراف:</b></div><div>أ.د. خالد نوفل</div><div>د. محمد مسعد</div></div></div>`)}
function pAbout(){R(`<div class="card"><h2>🎯 Software Objectives</h2><div class="ct"><p>By the end of this software, you will be able to:</p><ul><li>Explain intelligent interconnected systems (IoT, AI and robotics) and their impact on climate change.</li><li>Recognize advanced cyber threats and plan how to counter them.</li><li>Explain the characteristics, sources and types of big data.</li><li>Describe how big data is processed and how AI relies on it.</li></ul></div><h2>🧭 How to Navigate</h2><div class="steps"><div><i>1</i><b>Previous / Next:</b> move through the pages in order.</div><div><i>2</i><b>Home:</b> go back to the Welcome page.</div><div><i>3</i><b>☰ Site Map:</b> jump to any page you have unlocked.</div><div><i>4</i><b>🔊 Sound:</b> tap Listen or Play story to hear a lesson read aloud. The 🔊 button at the top turns sound on or off. Each lesson ends with a short video, then its quiz.</div><div><i>5</i><b>Quizzes:</b> pass ${PASS}% to unlock the next lesson. Pass the Final Exam with ${FIN}% to receive your certificate.</div><div><i>6</i><b>📊 Dashboard:</b> follow your scores, badges and titles.</div></div></div>`)}
function pUnit(){R(`<div class="card"><div class="c"><div class="big">🤖🔐</div><h2>Unit 1</h2><h3>Artificial Intelligence and Protecting Our Digital Data</h3></div><div class="ct"><h3>Lesson 1: Intelligent Systems and Their Impact on Climate Change</h3><ul><li>Explain intelligent interconnected systems (IoT, AI, robotics).</li><li>Conclude their impact on facing environmental problems (air pollution and drought).</li><li>Suggest ideas for using them to help protect the environment.</li></ul><h3>Lesson 2: Advanced Cyber Threats</h3><ul><li>Explain advanced fraudulent threats.</li><li>Mention ideas for countering advanced cyber threats.</li><li>Propose a plan to counter DDoS attacks.</li></ul><h3>Lesson 3: Big Data</h3><ul><li>Explain the characteristics of big data.</li><li>Discuss secure big data sources.</li><li>Infer the types of big data.</li></ul><h3>Lesson 4: Big Data and Its Relationship to Artificial Intelligence</h3><ul><li>Discuss the stages of big data processing.</li><li>Explain the uses of big data.</li><li>Cite examples of how AI relies on big data.</li></ul></div></div>`)}
function pHome(){R(`<div class="card c"><div class="big">🎉</div><h1>Welcome, ${esc(S.name)}!</h1><p>We are glad to have you in Unit 1: Artificial Intelligence and Protecting Our Digital Data.</p><button onclick="go('credits')">Start ➜</button></div>`)}
function setName(){const v=document.getElementById("nm").value.trim();if(!v){document.getElementById("mg").textContent="Please enter your name first.";return}S.name=v;save();render()}
function newStudent(){Object.assign(S,{name:"",res:[],att:[0,0,0,0],pre:null,fin:null,fa:0,pts:0,seen:[]});save();S.pg="title";render()}
function pMap(){const dn={pre:!!S.pre,fin:!!S.fin&&S.fin.p>=FIN,cert:!!S.fin&&S.fin.p>=FIN};R(`<div class="card"><h2>🗺️ Site Map</h2><p class="sub">Tap a title to go directly to it. 🔒 means complete the previous step first.</p>${PG.map(id=>{const k=+id.slice(1),o=ok(id),d=id[0]=="Q"?!!S.res[k]:lp(id)?!!S.seen[k]:dn[id];return `<div class="lv ${o?"":"lock"}" onclick="go('${id}')" style="cursor:pointer"><span class="ic">${!o?"🔒":d?"✅":"▶️"}</span><div><b>${NM[id]}</b></div></div>`}).join("")}</div>`)}
function lessonP(){const k=+S.pg[1],L=D[k],n=L.cards.length+1,last=S.ci>=L.cards.length;if(last){S.seen[k]=true;save()}const c=L.cards[S.ci];
R(`<div class="card"><div class="sub">Lesson ${k+1} of 4</div><h2>${L.e} ${L.n}</h2><div class="bar"><i style="width:${(S.ci+1)/n*100}%"></i></div>${last?`<div class="c"><div class="big">🎬</div><h3>Watch the video</h3><p class="sub">Watch a short video about this lesson, then take the quiz.</p><a class="btn" href="${L.vid}" target="_blank" rel="noopener">▶ Watch on YouTube</a></div>`:`<h3>${c.i} ${c.t}</h3><div class="ct">${c.h}</div>`}<div class="dots">${Array.from({length:n},(_,j)=>`<i class="${j==S.ci?"on":""}"></i>`).join("")}</div><div class="c"><button class="alt sm" onclick="speak()">🔊 Listen</button><button class="alt sm" onclick="story()">▶ Play story</button><button class="alt sm" onclick="stopS();S.story=false">⏹ Stop</button></div>${last?`<div class="c"><button onclick="go('Q${k}')">Go to Quiz ➜</button></div>`:""}</div>`)}
function zt(){return Z.m=="pre"?"Pre-test":Z.m=="fin"?"Final Exam":"Quiz on Lesson "+(Z.k+1)+": "+D[Z.k].n}
function intro(m,k){k=k||0;const q=m=="q"?D[k].q.length:m=="pre"?12:20,t=m=="q"?"Quiz on Lesson "+(k+1)+": "+D[k].n:m=="pre"?"Pre-test":"Final Exam",info=m=="pre"?"Check what you already know. There is no pass mark.":m=="fin"?`Questions from all four lessons. Score ${FIN}% or more to receive your Certificate of Appreciation.`:`Score ${PASS}% or more to unlock the next step. Each correct answer gives ${PTS} points.`,pv=m=="pre"&&S.pre?`<p>Your last score: <b>${S.pre.p}%</b></p>`:m=="fin"&&S.fin?`<p>Your best score: <b>${S.fin.p}%</b></p>`:"";R(`<div class="card c"><div class="big">${m=="fin"?"🎓":m=="pre"?"📝":"❓"}</div><h2>${t}</h2><p>${q} questions</p><p class="sub">${info}</p>${pv}<button onclick="startZ('${m}',${k})">Start ➜</button></div>`)}
function startZ(m,k){const qs=m=="q"?D[k].q:m=="pre"?smp(D.flatMap(l=>smp(l.q,3)),12):smp(D.flatMap(l=>smp(l.q,5)),20);Z={m,k,qs,i:0,c:0};zq()}
function zq(){Z.active=true;lockA=false;const q=Z.qs[Z.i],tot=Z.qs.length;let a;
if(q.t=="mcq")a=q.o.map((o,i)=>`<button class="op" onclick="za(${i})">${"abcd"[i]}) ${esc(o)}</button>`).join("");else if(q.t=="tf")a=`<button class="op" onclick="za(true)">✔ True</button><button class="op" onclick="za(false)">✘ False</button>`;else a=`<input type="text" id="fi" placeholder="Type your answer..." onkeydown="if(event.key=='Enter')za()"><br><button onclick="za()">Check ✔</button>`;
R(`<div class="card"><div class="sub">${esc(zt())} · Question ${Z.i+1} / ${tot}</div><div class="bar"><i style="width:${Z.i/tot*100}%"></i></div><div class="q">${esc(q.q)}</div><div id="ops">${a}</div><div class="fb" id="fb"></div><div id="nx"></div><button class="alt sm" onclick="rq()">🔊 Read question</button></div>`);if(S.snd)rq()}
function za(v){if(lockA)return;const q=Z.qs[Z.i];let ok;if(q.t=="fill"){const x=document.getElementById("fi").value.trim().toLowerCase().replace(/\s+/g," ");if(!x)return;ok=q.a.includes(x)}else ok=v===q.a;lockA=true;
const fb=document.getElementById("fb"),an=q.t=="mcq"?q.o[q.a]:q.t=="tf"?(q.a?"True":"False"):q.a[0];
if(ok){Z.c++;fb.style.color="var(--ok)";fb.textContent=Z.m=="pre"?"✅ Correct!":`✅ Correct! +${PTS} points`}else{fb.style.color="var(--bd)";fb.textContent="❌ Not correct. Answer: "+an}

document.querySelectorAll("#ops .op").forEach((b,i)=>{b.disabled=true;if(q.t=="mcq"){if(i==q.a)b.classList.add("ok");else if(i===v)b.classList.add("no")}else if(q.t=="tf"){if((i==0)===q.a)b.classList.add("ok");else if((i==0)===v)b.classList.add("no")}});
tone(ok?"ok":"no");if(S.snd)setTimeout(()=>say(ok?"Correct!":"Not correct. The correct answer is "+an),ok?500:600);
const fi=document.getElementById("fi");if(fi){fi.disabled=true;document.querySelector("#ops button").disabled=true}
const last=Z.i==Z.qs.length-1;document.getElementById("nx").innerHTML=`<p class="sub">Tap <b>Next ➡</b> below ${last?"to see your result":"for the next question"}.</p>`}
function zEnd(){Z.active=false;const t=Z.qs.length,p=pc(Z.c,t),k=Z.k,sc=`<p>Score: <b>${Z.c} / ${t}</b> (${p}%)</p>`;
if(Z.m=="pre"){S.pre={p,c:Z.c,t};save();R(`<div class="card c"><div class="big">📝</div><h2>Pre-test complete</h2>${sc}<p class="sub">This only shows your starting level. Now let us learn!</p><button onclick="go('L0')">Start Lesson 1 ➜</button></div>`);return}
if(Z.m=="fin"){S.fa++;const pass=p>=FIN;if(!S.fin||S.fin.p<p)S.fin={p,c:Z.c,t};pts();save();lvlSnd(pass);R(pass?`<div class="card c"><div class="big">🎉</div><h2>Final Exam Passed!</h2>${sc}<button onclick="go('cert')">Get my Certificate 🏆</button></div>`:`<div class="card c"><div class="big">😕</div><h2>Try Again!</h2><div class="badge fail">${p}%</div><p>You need at least ${FIN}% to get the certificate.</p><button onclick="go('map')">Review lessons</button><button onclick="intro('fin')">Retake exam</button></div>`);return}
S.att[k]=(S.att[k]||0)+1;
if(p<PASS){save();lvlSnd(false);R(`<div class="card c"><div class="big">😕</div><h2>Try Again!</h2><div class="badge fail">${p}%</div><p>You need at least ${PASS}% to move on.</p><button onclick="go('L${k}')">📖 Review the lesson</button><button onclick="intro('q',${k})">🔄 Retake the quiz</button></div>`);return}
const b=badge(p),ti=D[k].ti;if(!S.res[k]||S.res[k].p<p)S.res[k]={p,ti,b:b[0],c:Z.c,t};pts();save();lvlSnd(true);
R(`<div class="card c"><div class="big">🎉</div><h2>Lesson ${k+1} Quiz Complete!</h2>${sc}<div class="badge ${b[0]}">${b[1]}</div><p class="sub">You earned the title:</p><div class="title">${ti[1]} ${ti[0]}</div><br><button onclick="next()">${k<3?"Next Lesson ➜":"Final Exam ➜"}</button></div>`)}
function pCert(){R(`<div class="card c cert" id="cert"><div class="big">🏆</div><h1>Certificate of Appreciation</h1><p>This certificate is proudly presented to</p><div class="title" style="font-size:30px">${esc(S.name)}</div><p>for successfully completing<br><b>Unit 1: Artificial Intelligence and Protecting Our Digital Data</b><br>(ICT – Second Year Preparatory, First Term)<br>with a Final Exam score of <b>${S.fin.p}%</b>.</p><p>Date: ${new Date().toLocaleDateString("en-GB")}</p><div class="ar" style="margin-top:14px"><b>بسمله وليد علي ابراهيم</b><br><small>Basmala Walid Ali Ibrahim · Educational Technology Specialist</small></div></div><div class="c"><button onclick="window.print()">🖨 Print / Save as PDF</button></div>`)}
function mk(){return {n:S.name,p:S.pts,t:Date.now(),r:D.map((l,i)=>S.res[i]?[S.res[i].p,S.att[i]||0]:[null,S.att[i]||0]),x:[S.pre?S.pre.p:null,S.fin?S.fin.p:null]}}
function repText(){const o=mk();return `ICT Unit 1 Report\nStudent: ${S.name}\nPre-test: ${o.x[0]==null?"-":o.x[0]+"%"}\n`+o.r.map((r,i)=>`Quiz ${i+1}: ${r[0]!=null?r[0]+"% "+emo(r[0]):"not passed ("+r[1]+" tries)"}`).join("\n")+`\nFinal exam: ${o.x[1]==null?"-":o.x[1]+"%"}\nPoints: ${S.pts}\nCODE: ${enc(o)}`}
function dash(){const rows=[{l:"📝 Pre-test",p:S.pre&&S.pre.p,s:S.pre?"Completed":"Not started",a:null}];
D.forEach((x,i)=>{const r=S.res[i];rows.push({l:`${x.e} Quiz ${i+1}: ${x.n}`,p:r&&r.p,s:r?`Passed ✅ ${emo(r.p)} ${r.ti[1]} ${r.ti[0]}`:ok("Q"+i)?(S.att[i]?"Try again ⚠️":"Not started"):"Locked 🔒",a:S.att[i]||0})});
const fp=S.fin&&S.fin.p>=FIN;rows.push({l:"🎓 Final Exam",p:S.fin&&S.fin.p,s:S.fin?(fp?"Passed ✅":"Try again ⚠️"):ok("fin")?"Not started":"Locked 🔒",a:S.fa});rows.push({l:"🏆 Certificate",p:null,s:fp?"Earned ✅":"Locked 🔒",a:null});
const done=(S.pre?1:0)+S.res.filter(Boolean).length+(fp?1:0),tc=S.res.reduce((a,r)=>a+(r?r.c:0),0),tt=S.res.reduce((a,r)=>a+(r?r.t:0),0);
R(`<div class="card"><h2>📊 My Dashboard</h2><div class="bar"><i style="width:${done/6*100}%"></i></div><div class="g"><div><b>${done}/6</b>Steps done</div><div><b>${S.pts}</b>Points</div><div><b>${tt?pc(tc,tt):0}%</b>Quiz accuracy</div></div>${rows.map(r=>`<div class="row"><b>${r.l}</b><div class="bar"><i style="width:${r.p||0}%"></i></div><small>${r.s}${r.p!=null?" · "+r.p+"%":""}${r.a!=null?" · Attempts: "+r.a:""}</small></div>`).join("")}<div class="c"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(repText())}">📤 Send report to teacher</a><button class="alt" onclick="cp()">📋 Copy report</button><div class="msg" id="mg" style="color:var(--ok)"></div></div></div>`)}
function csv(){const m=Object.values(tget());return ["Student,Pre-test %,L1 %,L1 tries,L2 %,L2 tries,L3 %,L3 tries,L4 %,L4 tries,Final %,Points,Updated"].concat(m.map(o=>{const x=o.x||[null,null];return [`"${o.n.replace(/"/g,'""')}"`,x[0]==null?"":x[0]].concat(o.r.flatMap(r=>[r[0]==null?"":r[0],r[1]]),[x[1]==null?"":x[1],o.p,new Date(o.t).toLocaleDateString()]).join(",")})).join("\n")}
function tdash(msg){const m=Object.values(tget()).sort((a,b)=>a.n.localeCompare(b.n)),N=m.length,all=m.filter(o=>o.r.every(r=>r[0]!=null)).length,avg=N?Math.round(m.reduce((a,o)=>a+o.p,0)/N):0,cell=r=>r[0]!=null?r[0]+"% "+emo(r[0]):r[1]?"❌ "+r[1]+" tries":"–",xc=v=>v==null?"–":v+"%";
R(`<div class="card"><h2>👩‍🏫 Class Dashboard</h2><div class="g"><div><b>${N}</b>Students</div><div><b>${all}</b>Passed all 4 quizzes</div><div><b>${m.filter(o=>o.x&&o.x[1]>=FIN).length}</b>Got certificate</div><div><b>${avg}</b>Avg. points</div></div><p class="sub">Students tap “Send report to teacher” in their dashboard. Paste the messages or codes here:</p><textarea id="pa" placeholder="ICT1...."></textarea><div class="msg" id="mg" style="color:var(--ok)">${msg||""}</div><button onclick="tadd()">➕ Add to table</button><button class="alt" onclick="tcsv()">⬇ Export CSV</button><button class="alt" onclick="tclear()">🗑 Clear</button><div class="sc"><table><tr><th>Student</th><th>Pre</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Final</th><th>Points</th></tr>${m.map(o=>`<tr><td>${esc(o.n)}</td><td>${xc(o.x&&o.x[0])}</td>${o.r.map(r=>`<td>${cell(r)}</td>`).join("")}<td>${xc(o.x&&o.x[1])}</td><td>${o.p}</td></tr>`).join("")||'<tr><td colspan="8">No students yet</td></tr>'}</table></div><p class="sub">Results are stored on this device only.</p><button class="alt" onclick="cover()">Exit</button></div>`)}
load();cover();
</script></body></html>
